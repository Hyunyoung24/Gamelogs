name: Keep Render backend awake

on:
  schedule:
    # 10분마다 백엔드에 핑을 보내 Render 무료 플랜의 15분 idle spin-down을 방지한다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS https://gamelogs-3pj0.onrender.com/games -o /dev/null
